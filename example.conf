# Example nginx.conf for ngx_http_auth_ldap_module against Active Directory.
# See README.md for every directive. Replace the host names, DNs and the
# password; the test suite checks this file with nginx -t (tests/suite/test_readme.py).

# Only for a dynamic build (--add-dynamic-module):
# load_module modules/ngx_http_auth_ldap_module.so;

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # Cache outcomes in each worker for 5 minutes.
    auth_ldap_cache_enabled          on;
    auth_ldap_cache_expiration_time  5m;
    auth_ldap_cache_size             1000;

    ldap_server ad_1 {
        # Search base, login attribute, scope and filter (RFC 4516). Port 3268
        # is the Global Catalog; the scope defaults to "base", so set "sub".
        url "ldap://dc1.example.com:3268/OU=Offices,DC=company,DC=com?sAMAccountName?sub?(objectClass=person)";
        # Account to search with; without binddn the module binds anonymously.
        binddn "CN=Operator,OU=Service Accounts,DC=company,DC=com";
        # Never logged. Better: keep both lines in a root-only file and
        # "include" it here.
        binddn_passwd "CHANGE-ME";
        # Attribute of a group entry that lists its members, as DNs.
        group_attribute member;
        group_attribute_is_dn on;
        # One matching "require user" or "require group" rule is enough (any),
        # or every one must match (all). The password is checked either way.
        satisfy any;
        # Allowed groups.
        require group "CN=Admins,OU=My Security Groups,DC=company,DC=com";
        require group "CN=New York Users,OU=My Security Groups,DC=company,DC=com";
        # Allowed users. "require valid_user" alone would admit every user who
        # is found and gives the right password.
        require user "CN=Batman,OU=Users,OU=New York Office,OU=Offices,DC=company,DC=com";
        require user "CN=Robocop,OU=Users,OU=New York Office,OU=Offices,DC=company,DC=com";
        # Connections per worker, and timeouts (defaults: 10s, 5s, 10s, 10s).
        connections 2;
        connect_timeout 5s;
        bind_timeout 5s;
        reconnect_timeout 10s;
        # After this time the request is answered with 503.
        request_timeout 5s;
    }

    server {
        listen       8081;
        server_name  localhost;

        location / {
            auth_ldap "Closed content";
            auth_ldap_servers ad_1;

            root   html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;

        location = /50x.html {
            root   html;
        }
    }
}
