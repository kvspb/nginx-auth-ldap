# Packages, the Docker image and the release.
#
# On every pull request and push to the main branches: build the .deb and
# .rpm packages for the nginx of each distribution and the Docker image, on
# amd64 and arm64, and try each in a clean container against the LDAP
# server of the test environment (make package / package-smoke / image /
# image-smoke, see packaging/).
#
# On a release tag (vX.Y.Z), or a manual run for an existing tag, also:
# the source tarball, SHA256SUMS and build provenance attestations, the
# GitHub release with the notes of CHANGELOG.md, the image on GHCR and the
# APT repository on GitHub Pages (off until APT_REPOSITORY is set, see apt).
# Only the newest release moves the image tags latest and mainline and
# replaces the APT repository: a manual run for an older tag leaves them.
name: packages

on:
  pull_request:
  push:
    branches: [master, dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish again, e.g. v1.2.1
        required: true

permissions:
  contents: read

concurrency:
  group: >-
    packages-${{ github.event.pull_request.number || github.ref
    }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Checked out and released: the tag of a manual run, else the event ref.
  REF: ${{ inputs.tag || github.ref }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      newest: ${{ steps.version.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(packaging/version.sh)
          publish=false
          case "${EVENT}:${REF}" in
            workflow_dispatch:* | push:refs/tags/v*) publish=true ;;
          esac
          tags=$(git tag --points-at HEAD)
          if [ "${publish}" = true ] \
            && ! echo "${tags}" | grep -qx "v${version}"; then
            echo "::error::${REF} is not a release tag vX.Y.Z"
            exit 1
          fi
          # Whether no release tag is newer than this one.
          newest=false
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ "v${version}" = "${last}" ]; then
            newest=true
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "publish=${publish}" >>"${GITHUB_OUTPUT}"
          echo "newest=${newest}" >>"${GITHUB_OUTPUT}"
      - name: Source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="nginx-auth-ldap-${VERSION}/" \
            -o "release/nginx-auth-ldap-${VERSION}.tar.gz" HEAD
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source
          path: release/

  package:
    name: ${{ matrix.image }} ${{ matrix.runner }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The nginx of each must be 1.22 or newer. Enterprise Linux 9 ships
        # 1.20 by default; Ubuntu 22.04 ships 1.18.
        image:
          - debian:bookworm
          - debian:trixie
          - ubuntu:24.04
          - fedora:43
          - fedora:44
          - almalinux:10
        # amd64, arm64
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      PACKAGE_IMAGE: ${{ matrix.image }}
      PACKAGE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Build
        run: make package
      - name: Install and try
        run: make package-smoke
      - name: Artifact name
        id: name
        env:
          RUNNER: ${{ matrix.runner }}
        run: |
          name="package-${PACKAGE_IMAGE/:/-}-${RUNNER}"
          echo "name=${name}" >>"${GITHUB_OUTPUT}"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.name.outputs.name }}
          # dist/<image>/: the APT repository maps the directory to a suite.
          path: |
            dist/*/*.deb
            dist/*/*.rpm
          if-no-files-found: error
      - name: Stop the LDAP server
        if: always()
        run: make test-down

  image:
    name: image nginx ${{ matrix.nginx }} ${{ matrix.arch }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in line with NGINX_VERSIONS in the Makefile: stable, mainline.
        nginx: [1.30.6, 1.31.8]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NGINX_VERSION: ${{ matrix.nginx }}
      VERSION: ${{ needs.source.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PUBLISH: ${{ needs.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Build, try, push
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          # A tag has no "+": 1.2.1+git20261111.dce534a between releases.
          tag="${IMAGE}:${VERSION//+/-}-nginx${NGINX_VERSION}-${ARCH}"
          make image IMAGE="${tag}"
          make image-smoke IMAGE="${tag}"
          if [ "${PUBLISH}" = true ]; then
            echo "${TOKEN}" \
              | docker login ghcr.io -u "${ACTOR}" --password-stdin
            docker push "${tag}"
          fi
      - name: Stop the LDAP server
        if: always()
        run: make test-down

  image-manifest:
    # One multi-arch tag per nginx version, and the moving tags, which only
    # the newest release takes.
    if: needs.source.outputs.publish == 'true'
    needs: [source, image, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      NEWEST: ${{ needs.source.outputs.newest }}
      STABLE: 1.30.6
      MAINLINE: 1.31.8
    steps:
      - name: Manifests
        id: manifests
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${TOKEN}" \
            | docker login ghcr.io -u "${ACTOR}" --password-stdin
          # manifest <output> <nginx version> <tag>...
          manifest() {
            output=$1 nginx=$2
            shift 2
            base="${IMAGE}:${VERSION}-nginx${nginx}"
            set -- -t "${base}" "$@"
            docker buildx imagetools create "$@" "${base}-amd64" "${base}-arm64"
            digest=$(docker buildx imagetools inspect "${base}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "${output}=${digest}" >>"${GITHUB_OUTPUT}"
          }
          if [ "${NEWEST}" = true ]; then
            manifest stable "${STABLE}" \
              -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest"
            manifest mainline "${MAINLINE}" -t "${IMAGE}:mainline"
          else
            manifest stable "${STABLE}" -t "${IMAGE}:${VERSION}"
            manifest mainline "${MAINLINE}"
          fi
      # actions/attest-build-provenance v4.2.2
      # yamllint disable-line rule:line-length
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.stable }}
          push-to-registry: true
      # actions/attest-build-provenance v4.2.2
      # yamllint disable-line rule:line-length
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.mainline }}
          push-to-registry: true

  release:
    if: needs.source.outputs.publish == 'true'
    needs: [source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      NEWEST: ${{ needs.source.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
      - name: Assets
        run: |
          mkdir release
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release/ \;
          (cd release && sha256sum -- * >SHA256SUMS)
          cat release/SHA256SUMS
      # actions/attest-build-provenance v4.2.2
      # yamllint disable-line rule:line-length
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release/SHA256SUMS
      - name: Notes
        run: |
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' >notes.md
          if ! [ -s notes.md ]; then
            echo "::error::no ${VERSION} section in CHANGELOG.md"
            exit 1
          fi
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -A1 -x "v${VERSION}" | sed -n 2p)
          if [ -n "${previous}" ]; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            printf '\nFull list of changes: %s/compare/%s...v%s\n' \
              "${url}" "${previous}" "${VERSION}" >>notes.md
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release/* --clobber
          else
            gh release create "v${VERSION}" --title "${VERSION}" \
              --notes-file notes.md --verify-tag --latest="${NEWEST}" \
              release/*
          fi

  apt:
    # The APT repository on GitHub Pages, signed with the APT_SIGNING_KEY
    # secret. Off until the repository variable APT_REPOSITORY is "true";
    # to turn it on also allow tags v* to deploy to the github-pages
    # environment (Settings, Environments), which allows master only. Every
    # run replaces the repository as a whole, so only the newest release
    # may.
    if: >-
      needs.source.outputs.publish == 'true'
      && needs.source.outputs.newest == 'true'
      && vars.APT_REPOSITORY == 'true'
    needs: [source, package, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Repository
        run: |
          docker run --rm -e SIGNING_KEY \
            -v "${PWD}/packaging/apt:/apt:ro" -v "${PWD}/dist:/dist:ro" \
            -v "${PWD}/site:/out" debian:trixie /apt/build-repo.sh
          sudo chown -R "$(id -u):$(id -g)" site
          cp packaging/apt/index.html site/
      # actions/upload-pages-artifact v5.0.0
      # yamllint disable-line rule:line-length
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      # actions/deploy-pages v5.0.1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deploy
