# Checks for pull requests and the main branches: lint, the integration
# suite on every supported nginx version, AddressSanitizer, debug and other
# builds, and mutation testing of the lines a pull request or a push to dev
# changes (or of a range given to a manual run).
#
# Everything runs through the Makefile and tests/docker-compose.yml, exactly
# as on a developer machine (see tests/README.md).
name: tests

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Mutation testing of the changes since this git ref (a commit, tag
          or branch); empty for none
        required: false
        default: ""

permissions:
  contents: read

# A new commit of a pull request replaces its runs. Pushes are never
# cancelled: the mutation testing of a push covers only its own commits.
concurrency:
  group: tests-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF: ruff==0.17.3

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whitespace errors in the changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE}...HEAD"
      - name: Shell scripts
        run: |
          shellcheck tests/runner/run-tests.sh \
            tests/mutation/run-mutation.sh \
            tests/ldap/entrypoint.sh \
            tests/ldap/tls/generate.sh \
            packaging/*.sh packaging/apt/*.sh
      - name: Python (ruff)
        working-directory: tests
        run: |
          pipx run "${RUFF}" check .
          pipx run "${RUFF}" format --check suite mutation

  test:
    name: nginx ${{ matrix.nginx }} ${{ matrix.flavor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep in line with NGINX_VERSIONS in the Makefile: the pre-1.23
        # header API, current stable, current mainline.
        nginx: [1.22.1, 1.30.6, 1.31.8]
        flavor: [plain]
        include:
          - nginx: 1.30.6
            flavor: asan
            sanitize: 1
          # Debug builds hide double queue removals: run both kinds.
          - nginx: 1.30.6
            flavor: debug
            debug: 1
          # Other builds (make test-builds): a dynamic module, Alpine Linux
          # (musl), and the oldest supported OpenSSL built from source.
          - nginx: 1.30.6
            flavor: dynamic
            dynamic: 1
          - nginx: 1.30.6
            flavor: alpine
            runner: tests-alpine
          - nginx: 1.30.6
            flavor: openssl-1.1.1
            openssl: 1.1.1w
    env:
      NGINX_VERSION: ${{ matrix.nginx }}
      SANITIZE: ${{ matrix.sanitize || 0 }}
      NGINX_DEBUG: ${{ matrix.debug || 0 }}
      DYNAMIC: ${{ matrix.dynamic || 0 }}
      OPENSSL_VERSION: ${{ matrix.openssl || '' }}
      RUNNER: ${{ matrix.runner || 'tests' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Integration suite
        run: make test PYTEST_ARGS="-q -ra"
      - name: LDAP server log
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs ldap | tail -n 300
      - name: Stop the LDAP server
        if: always()
        run: make test-down

  mutate:
    # Mutants of the lines a pull request, a push to dev or a manual run
    # (input "base") changes, each run against the whole suite. Not on
    # master, which only receives merges of a tested dev. There is no score
    # threshold: survivors are reviewed by hand (AGENTS.md, "Quality
    # gates"), so this job only fails when the run itself fails.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      || (github.event_name == 'workflow_dispatch' && inputs.base != '')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Base of the diff
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          case "${EVENT}" in
            pull_request)
              base=$(git merge-base "${PR_BASE}" HEAD) ;;
            workflow_dispatch)
              base=$(git rev-parse --verify "${INPUT_BASE}^{commit}") ;;
            push)
              # A new branch has no "before", a forced push an unrelated one:
              # then everything since master.
              if git merge-base --is-ancestor "${BEFORE}" HEAD 2>/dev/null; then
                base="${BEFORE}"
              else
                base=$(git merge-base origin/master HEAD)
              fi ;;
          esac
          echo "base=${base}" >>"${GITHUB_OUTPUT}"
          if git diff --quiet "${base}" HEAD -- src; then
            echo "No change in src/ since ${base}: nothing to mutate." | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >>"${GITHUB_OUTPUT}"
          fi
      - name: Mutation testing of the diff
        if: steps.base.outputs.skip != 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: make mutate BASE="${BASE}"
      - name: Summary
        if: always() && hashFiles('tests/reports/mutation/mutation.json') != ''
        run: python3 tests/mutation/summary.py >>"${GITHUB_STEP_SUMMARY}"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mutation-report
          path: tests/reports/mutation/
          if-no-files-found: ignore
      - name: Stop the LDAP server
        if: always()
        run: make test-down
