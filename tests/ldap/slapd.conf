# Static slapd configuration for the test directory (dc=example,dc=org).
include     /etc/openldap/schema/core.schema
include     /etc/openldap/schema/cosine.schema
include     /etc/openldap/schema/inetorgperson.schema
include     /etc/openldap/schema/nis.schema

pidfile     /run/openldap/slapd.pid
argsfile    /run/openldap/slapd.args

# ldaps:// on 636. Test-only key, see tests/ldap/tls/generate.sh.
TLSCACertificateFile  /etc/openldap/tls/ca.crt
TLSCertificateFile    /etc/openldap/tls/server.crt
TLSCertificateKeyFile /etc/openldap/tls/server.key

modulepath  /usr/lib/openldap
moduleload  back_mdb.so

database    mdb
maxsize     104857600
suffix      "dc=example,dc=org"
rootdn      "cn=admin,dc=example,dc=org"
# Test-only credential, never reuse outside this container.
rootpw      admin-secret
directory   /var/lib/openldap/openldap-data

index objectClass eq
index uid         eq
index cn          eq
index member      eq

# Passwords are usable for binding only; everything else is world-readable,
# which mirrors a typical directory with a read-only service account.
access to attrs=userPassword
    by self write
    by anonymous auth
    by * none
access to *
    by * read
